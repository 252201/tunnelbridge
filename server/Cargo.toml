[package]
name = "tunnelbridge-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
dashmap = "6.1"
futures-util.workspace = true
http.workspace = true
ipnet.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = { version = "0.6", features = ["all"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "limit", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tunnelbridge-protocol = { path = "../crates/protocol" }
uuid.workspace = true

[dev-dependencies]
tempfile = "3.22"
tokio-tungstenite = "0.29"
reqwest = { workspace = true, features = ["json"] }
