name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: bash -n scripts/deploy-server.sh
      - run: cargo fmt --all --check
      - run: cargo clippy -p tunnelbridge-protocol -p tunnelbridge-server --all-targets -- -D warnings
      - run: cargo test -p tunnelbridge-protocol -p tunnelbridge-server
