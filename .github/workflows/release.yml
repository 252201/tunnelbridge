name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write

jobs:
  server-image:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name == 'push' }}
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      meta-images: ghcr.io/${{ github.repository_owner }}/tunnelbridge-server
      meta-tags: |
        type=raw,value=${{ github.ref_name }}
        type=raw,value=latest
      cache: true
      cache-scope: tunnelbridge-server
      cache-mode: max
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  macos-app:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and publish ad-hoc signed universal app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `-` is Apple's ad-hoc identity. It does not require a Developer ID
          # certificate and deliberately skips notarization.
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: TunnelBridge ${{ github.ref_name }}
          releaseBody: |
            This macOS build is ad-hoc signed and is not notarized by Apple.

            On first launch, move TunnelBridge to Applications and try to open it.
            Then open System Settings > Privacy & Security and choose Open Anyway.

            Download releases only from this repository. Automatic update artifacts
            are independently signed with the TunnelBridge updater key.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target universal-apple-darwin
