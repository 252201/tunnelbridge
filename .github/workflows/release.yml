name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write

jobs:
  server-image:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      actions: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name == 'push' }}
      platforms: linux/amd64,linux/arm64
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      meta-images: ghcr.io/${{ github.repository_owner }}/tunnelbridge-server
      meta-tags: |
        type=raw,value=${{ github.ref_name }}
        type=raw,value=latest
      cache: true
      cache-scope: tunnelbridge-server
      cache-mode: max
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  macos-app:
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare release notes
        id: release-notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          from textwrap import dedent
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{tag}]"
          start = changelog.find(marker)
          if start < 0:
              raise SystemExit(f"No changelog section found for {tag}")

          section = changelog[start:]
          next_section = re.search(r"^## \[", section[len(marker):], re.MULTILINE)
          if next_section:
              section = section[:len(marker) + next_section.start()]

          install_note = dedent("""
          ---

          ## macOS 安装说明

          本版本 macOS 应用使用 ad-hoc 签名，未经过 Apple 公证。首次启动时请将 TunnelBridge 移入“应用程序”，尝试打开后前往“系统设置 > 隐私与安全性”，选择“仍要打开”。

          仅从本仓库下载发行版。自动更新资产使用 TunnelBridge 更新密钥独立签名。
          """).strip()
          body = section.strip() + "\n\n" + install_note
          print("body<<__TUNNELBRIDGE_RELEASE_BODY__")
          print(body)
          print("__TUNNELBRIDGE_RELEASE_BODY__")
          PY
      - name: Build and publish ad-hoc signed universal app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `-` is Apple's ad-hoc identity. It does not require a Developer ID
          # certificate and deliberately skips notarization.
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: TunnelBridge ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target universal-apple-darwin
